<!DOCTYPE html>
<html lang="it">

<head>
  <meta charset="UTF-8">
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#041718">
  <title>Orario Pellicano</title>
  <meta name="description"
    content="Single Page Application mobile-first per la consultazione rapida dell'orario scolastico EDT: classi, docenti, radar colleghi, sostituzioni e stampa.">

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="./public/icon-192.png">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./public/icon-192.png">

  <!-- Preload Font Locale Space Mono per rendering istantaneo a zero latenza -->
  <link rel="preload" href="./public/fonts/SpaceMono-Regular.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="./public/fonts/SpaceMono-Bold.woff2" as="font" type="font/woff2" crossorigin>

  <!-- Google Fonts: Material Symbols Outlined -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <!-- Styles: Main & Print -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/print.css">
</head>

<body>
  <div id="app">
    <!-- Search Bar Unificata con Sync Badge Integrato (Header rimosso per massima compattezza) -->
    <div class="search-container" id="searchContainer">
      <div class="search-bar-row">
        <!-- Sync Status Badge (Quadrato a sinistra con icona Material Symbols) -->
        <button class="sync-status-badge syncing" id="syncStatusBadge" title="Tocca per verificare aggiornamenti">
          <span class="material-symbols-outlined sync-icon syncing" id="syncIcon">sync</span>
        </button>

        <div class="unified-search-box">
          <span class="material-symbols-outlined search-icon-left" style="font-size: 18px;">search</span>
          <input type="text" id="unifiedSearchInput" class="search-input"
            placeholder="Cerca classe, docente o materia..." autocomplete="off" autocorrect="off" autocapitalize="none"
            spellcheck="false">
          <button id="searchClearBtn" class="search-clear-btn" title="Cancella ricerca">
            <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
          </button>
        </div>

        <!-- Dropdown Preferiti Toggle (Chevron essenziale senza bordi a destra) -->
        <button class="favs-dropdown-toggle-btn" id="favsDropdownToggleBtn" title="Mostra/nascondi preferiti" aria-label="Mostra/nascondi preferiti" aria-expanded="false">
          <span class="material-symbols-outlined favs-chevron" id="favsChevron">expand_more</span>
        </button>
      </div>

      <!-- Quick Filter Pills (Preferiti a comparsa / dropdown) -->
      <div class="quick-picks-bar" id="quickPillsBar"></div>

      <!-- Autocomplete Dropdown -->
      <div class="search-results-dropdown" id="searchResultsDropdown"></div>
    </div>

    <!-- Main Dynamic Content (Viste SPA) -->
    <main class="main-content" id="mainContent">
      <div class="state-container">
        <div class="spinner"></div>
        <div class="state-title">Caricamento dell'orario in corso...</div>
      </div>
    </main>

    <!-- Bottom Navigation Bar (Ergonomica a una mano) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item-btn active" data-nav="schedule" title="Orario" aria-label="Orario">
        <span class="material-symbols-outlined">calendar_today</span>
      </button>

      <button class="nav-item-btn" data-nav="radar" title="Radar docenti" aria-label="Radar">
        <span class="material-symbols-outlined">radar</span>
      </button>

      <button class="nav-item-btn" data-nav="subs" title="Dashboard sostituzioni" aria-label="Sostituzioni">
        <span class="material-symbols-outlined">swap_horiz</span>
      </button>

      <button class="nav-item-btn" data-nav="favorites" title="Preferiti salvati" aria-label="Preferiti">
        <span class="material-symbols-outlined">star</span>
      </button>

      <button class="nav-item-btn" data-nav="settings" title="Impostazioni" aria-label="Impostazioni">
        <span class="material-symbols-outlined">settings</span>
      </button>
    </nav>

    <!-- Container Toast Notifiche -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal Impostazioni & Informazioni Semplificato -->
    <div class="modal-overlay" id="settingsModalOverlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" style="display: flex; align-items: center; gap: 8px;">
            <span class="material-symbols-outlined" style="color: var(--accent-primary);">settings</span>
            Impostazioni
          </h2>
          <button class="icon-btn" id="modalCloseBtn">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <!-- Sincronizzazione compatta con Sync Badge + Descrittore + Svuota Cache -->
        <div class="settings-sync-row" style="display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 14px; background: var(--bg-card); padding: 8px 12px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle);">
          <div style="display: flex; align-items: center; gap: 10px;">
            <button class="sync-status-badge online" id="modalSyncBadgeBtn" title="Tocca per forzare la sincronizzazione" style="background: var(--bg-input);">
              <span class="material-symbols-outlined sync-icon online" id="modalSyncIcon">cloud_done</span>
            </button>
            <div>
              <div style="font-size: 0.85rem; font-weight: 700; color: var(--text-primary);" id="modalSyncStatusTitle">Sincronizzato</div>
              <div style="font-size: 0.72rem; color: var(--text-muted);" id="modalSyncStatusSub">Tocca per verificare</div>
            </div>
          </div>
          <button class="btn-secondary" id="modalClearCacheBtn" title="Svuota cache locale" style="padding: 6px 10px; font-size: 0.76rem; color: #f87171; display: inline-flex; align-items: center; gap: 4px;">
            <span class="material-symbols-outlined" style="font-size: 16px;">delete</span>
            Svuota cache
          </button>
        </div>

        <!-- Toggle Tema Diretto (senza titolo) -->
        <div style="margin-bottom: 14px;">
          <button class="btn-secondary" id="modalThemeToggleBtn" style="width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px; padding: 10px 14px;">
            <span class="material-symbols-outlined" style="font-size: 18px;">light_mode</span>
            Attiva tema chiaro
          </button>
        </div>

        <!-- Widget Next-Up Toggle -->
        <div style="margin-bottom: 14px; background: var(--bg-card); padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div style="font-size: 0.88rem; font-weight: 700; color: var(--text-primary);">Widget "Prossima Lezione"</div>
          <label class="custom-toggle-switch" for="modalNextUpToggle" aria-label="Attiva widget Prossima Lezione">
            <input type="checkbox" id="modalNextUpToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <!-- Toggle Aula Lista Docenti -->
        <div style="margin-bottom: 16px; background: var(--bg-card); padding: 12px 14px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); display: flex; align-items: center; justify-content: space-between; gap: 10px;">
          <div style="font-size: 0.88rem; font-weight: 700; color: var(--text-primary);">Mostra aula nella lista docenti</div>
          <label class="custom-toggle-switch" for="modalTeacherRoomToggle" aria-label="Mostra aula nella lista docenti">
            <input type="checkbox" id="modalTeacherRoomToggle">
            <span class="toggle-slider"></span>
          </label>
        </div>

        <div class="form-group">
          <label class="form-label">Statistiche dataset</label>
          <div id="modalStatsContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry point JavaScript modulare -->
  <script type="module" src="./src/app.js"></script>
</body>

</html>
