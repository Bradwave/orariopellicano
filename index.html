<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#041718">
  <title>Orario Pellicano • Consultazione Orario</title>
  <meta name="description" content="Single Page Application mobile-first per la consultazione rapida dell'orario scolastico EDT: classi, docenti, radar colleghi, sostituzioni e stampa.">

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./public/icon-192.png">

  <!-- Google Fonts: Space Mono & Material Symbols Outlined -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />

  <!-- Styles: Main & Print -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/print.css">
</head>
<body>
  <div id="app">
    <!-- Search Bar Unificata con Sync Badge Integrato (Header rimosso per massima compattezza) -->
    <div class="search-container" id="searchContainer">
      <div class="search-bar-row">
        <div class="unified-search-box">
          <span class="material-symbols-outlined search-icon-left" style="font-size: 18px;">search</span>
          <input 
            type="text" 
            id="unifiedSearchInput" 
            class="search-input" 
            placeholder="Cerca classe, docente o materia..." 
            autocomplete="off" 
            autocorrect="off" 
            autocapitalize="none" 
            spellcheck="false"
          >
          <button id="searchClearBtn" class="search-clear-btn" title="Cancella ricerca">
            <span class="material-symbols-outlined" style="font-size: 18px;">close</span>
          </button>
        </div>

        <!-- Sync Status Badge (Inizializzato in stato di verifica giallo) -->
        <button class="sync-status-badge syncing" id="syncStatusBadge" title="Tocca per verificare aggiornamenti">
          <span class="sync-dot syncing" id="syncDot"></span>
          <span id="syncStatusText" class="sync-status-text">Verifica...</span>
        </button>
      </div>

      <!-- Autocomplete Dropdown -->
      <div class="search-results-dropdown" id="searchResultsDropdown"></div>
    </div>

    <!-- Quick Filter Pills (Classi rapide / Preferiti) -->
    <div class="quick-picks-bar" id="quickPillsBar"></div>

    <!-- Main Dynamic Content (Viste SPA) -->
    <main class="main-content" id="mainContent">
      <div class="state-container">
        <div class="spinner"></div>
        <div class="state-title">Caricamento dell'orario in corso...</div>
      </div>
    </main>

    <!-- Bottom Navigation Bar (Ergonomica a una mano) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item-btn active" data-nav="class" title="Orario Classi">
        <span class="material-symbols-outlined">calendar_today</span>
        <span>Orario</span>
      </button>

      <button class="nav-item-btn" data-nav="radar" title="Radar Colleghi Live Tracker">
        <span class="material-symbols-outlined">radar</span>
        <span>Radar</span>
      </button>

      <button class="nav-item-btn" data-nav="subs" title="Dashboard Sostituzioni">
        <span class="material-symbols-outlined">swap_horiz</span>
        <span>Sostituzioni</span>
      </button>

      <button class="nav-item-btn" data-nav="favorites" title="Preferiti Salvati">
        <span class="material-symbols-outlined">star</span>
        <span>Preferiti</span>
      </button>

      <button class="nav-item-btn" data-nav="settings" title="Impostazioni">
        <span class="material-symbols-outlined">settings</span>
        <span>Impostazioni</span>
      </button>
    </nav>

    <!-- Container Toast Notifiche -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal Impostazioni & Informazioni -->
    <div class="modal-overlay" id="settingsModalOverlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title" style="display: flex; align-items: center; gap: 8px;">
            <span class="material-symbols-outlined" style="color: var(--accent-primary);">settings</span>
            Impostazioni
          </h2>
          <button class="icon-btn" id="modalCloseBtn">
            <span class="material-symbols-outlined">close</span>
          </button>
        </div>

        <div style="margin-bottom: 20px;">
          <label class="form-label">Sincronizzazione & Cache</label>
          <div style="display: flex; gap: 8px; margin-top: 6px;">
            <button class="btn-primary" id="modalSyncBtn" style="flex: 1;">
              <span class="material-symbols-outlined" style="font-size: 18px;">sync</span>
              Sincronizza Ora
            </button>
            <button class="btn-secondary" id="modalClearCacheBtn" style="flex: 1; color: #f87171;">
              <span class="material-symbols-outlined" style="font-size: 18px;">delete</span>
              Svuota Cache
            </button>
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <label class="form-label">Tema Interfaccia</label>
          <button class="btn-secondary" id="modalThemeToggleBtn" style="width: 100%; margin-top: 6px;">
            <span class="material-symbols-outlined" style="font-size: 18px;">light_mode</span>
            Attiva Tema Chiaro
          </button>
        </div>

        <div class="form-group">
          <label class="form-label">Statistiche Dataset</label>
          <div id="modalStatsContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry point JavaScript modulare -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
