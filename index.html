<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0b0f19">
  <title>Orario Pellicano • Consultazione Orario Scolastico</title>
  <meta name="description" content="Single Page Application mobile-first per la consultazione rapida dell'orario scolastico EDT: classi, docenti, radar colleghi, sostituzioni e stampa.">

  <!-- PWA Manifest & Favicon -->
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="apple-touch-icon" href="./public/icon-192.png">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">

  <!-- Styles: Main & Print -->
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/print.css">
</head>
<body>
  <div id="app">
    <!-- Header Applicazione -->
    <header class="app-header">
      <a href="#" class="brand" onclick="window.location.reload(); return false;">
        <img src="./favicon.svg" alt="Pellicano Logo" class="brand-icon">
        <div class="brand-info">
          <span class="brand-title">
            Orario Pellicano
          </span>
          <span class="brand-subtitle">
            Liceo • Consultazione Orari
          </span>
        </div>
      </a>

      <div class="header-actions">
        <!-- Sync Status Badge -->
        <div class="sync-status-badge" id="syncStatusBadge" title="Stato connessione e aggiornamento">
          <span class="sync-dot" id="syncDot"></span>
          <span id="syncStatusText">Connesso</span>
        </div>

        <!-- Settings Button -->
        <button class="icon-btn" id="settingsBtn" title="Impostazioni e Proxy Worker">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
    </header>

    <!-- Search Bar Unificata (Spotlight UI) -->
    <div class="search-container" id="searchContainer">
      <div class="unified-search-box">
        <svg class="search-icon-left" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input 
          type="text" 
          id="unifiedSearchInput" 
          class="search-input" 
          placeholder="Cerca classe (es. 1A), docente (es. Rossi) o materia..." 
          autocomplete="off" 
          autocorrect="off" 
          autocapitalize="none" 
          spellcheck="false"
        >
        <button id="searchClearBtn" class="search-clear-btn" title="Cancella ricerca">&times;</button>
      </div>

      <!-- Autocomplete Dropdown -->
      <div class="search-results-dropdown" id="searchResultsDropdown"></div>
    </div>

    <!-- Quick Filter Pills (Classi rapide / Preferiti) -->
    <div class="quick-picks-bar" id="quickPillsBar"></div>

    <!-- Main Dynamic Content (Viste SPA) -->
    <main class="main-content" id="mainContent">
      <div class="state-container">
        <div class="spinner"></div>
        <div class="state-title">Caricamento dell'orario in corso...</div>
      </div>
    </main>

    <!-- Bottom Navigation Bar (Ergonomica a una mano) -->
    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-item-btn active" data-nav="class" title="Orario Classi">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
        <span>Orario</span>
      </button>

      <button class="nav-item-btn" data-nav="radar" title="Radar Colleghi Live Tracker">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="m4.93 4.93 4.24 4.24"/><path d="m14.83 9.17 4.24-4.24"/><path d="m14.83 14.83 4.24 4.24"/><path d="m9.17 14.83-4.24 4.24"/></svg>
        <span>Radar</span>
      </button>

      <button class="nav-item-btn" data-nav="subs" title="Dashboard Sostituzioni">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 21h5v-5"/></svg>
        <span>Sostituzioni</span>
      </button>

      <button class="nav-item-btn" data-nav="favorites" title="Preferiti Salvati">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>
        <span>Preferiti</span>
      </button>

      <button class="nav-item-btn" data-nav="settings" title="Impostazioni">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        <span>Impostazioni</span>
      </button>
    </nav>

    <!-- Container Toast Notifiche -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Modal Impostazioni & Proxy Worker -->
    <div class="modal-overlay" id="settingsModalOverlay">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">⚙️ Impostazioni Proxy & Dati</h2>
          <button class="icon-btn" id="modalCloseBtn">&times;</button>
        </div>

        <div class="form-group">
          <label class="form-label" for="proxyUrlInput">Endpoint Cloudflare Worker Proxy (GET)</label>
          <input 
            type="url" 
            id="proxyUrlInput" 
            class="form-input" 
            placeholder="https://proxy-orario-pellicano.[tuo-account].workers.dev"
          >
          <div class="form-help">
            Inserisci l'URL del tuo Cloudflare Worker che fa da reverse proxy all'orario XML con intestazioni CORS.
          </div>
        </div>

        <div style="display: flex; gap: 8px; margin-bottom: 20px;">
          <button class="btn-primary" id="saveProxyBtn" style="flex: 2;">
            Salva Endpoint
          </button>
          <button class="btn-secondary" id="resetProxyBtn" style="flex: 1;" title="Ripristina URL di default">
            Predefinito
          </button>
        </div>

        <div style="margin-bottom: 20px;">
          <label class="form-label">Sincronizzazione Manuale & Cache</label>
          <div style="display: flex; gap: 8px; margin-top: 6px;">
            <button class="btn-secondary" id="modalSyncBtn" style="flex: 1;">
              🔄 Sincronizza Ora
            </button>
            <button class="btn-secondary" id="modalClearCacheBtn" style="flex: 1; color: #f87171;">
              🗑️ Svuota Cache
            </button>
          </div>
        </div>

        <div style="margin-bottom: 20px;">
          <label class="form-label">Tema Interfaccia</label>
          <button class="btn-secondary" id="modalThemeToggleBtn" style="width: 100%; margin-top: 6px;">
            ☀️ Attiva Tema Chiaro
          </button>
        </div>

        <div class="form-group">
          <label class="form-label">Statistiche Dataset Attivo</label>
          <div id="modalStatsContainer"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Entry point JavaScript modulare -->
  <script type="module" src="./src/app.js"></script>
</body>
</html>
