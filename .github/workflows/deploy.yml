name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

# Permessi necessari per il deployment nativo su GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Evita deployment concorrenti
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Inject Cache Version into sw.js
        run: |
          BUILD_ID="v-${{ github.sha }}"
          sed -i.bak -E "s/const CACHE_NAME = '.*';/const CACHE_NAME = 'orario-pellicano-$BUILD_ID';/" sw.js
          rm -f sw.js.bak
          echo "Injected CACHE_NAME=orario-pellicano-$BUILD_ID into sw.js"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
