<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Sfondo neutro scuro coordinato con il tema Dark Neutral Slate -->
  <rect width="64" height="64" rx="12" fill="#0e1116" />
  <rect x="1" y="1" width="62" height="62" rx="11" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />
  
  <!-- Icona geometrica minimale: Griglia orario + Profilo stilizzato Pellicano -->
  <!-- Linee orario/griglia minimale -->
  <rect x="14" y="15" width="36" height="4" rx="2" fill="#3b82f6" />
  
  <!-- Silhouette geometrica del Pellicano (minimalist flat design) -->
  <!-- Corpo e dorso a linee pulite -->
  <path d="M22 47C22 47 24 37 31 34C37 32 41 29 42 24C43 20 40 18 36 18C33 18 31 20 30 23L24 23C24 17 28 14 36 14C44 14 48 18 48 24C48 31 42 35 36 38C31 40 28 47 28 47H22Z" fill="#f3f4f6"/>
  <!-- Becco caratteristico in accento dorato/ambra sobrio -->
  <path d="M30 23C25 23 18 26 14 30C16 32 20 33 26 31C29 30 30 28 30 26V23Z" fill="#f59e0b"/>
  <!-- Occhio geometrico -->
  <circle cx="39" cy="21" r="1.75" fill="#0e1116"/>
  
  <!-- Indicatori orario in basso -->
  <rect x="33" y="44" width="8" height="3" rx="1.5" fill="#3b82f6" opacity="0.8"/>
  <rect x="43" y="44" width="7" height="3" rx="1.5" fill="#10b981" opacity="0.8"/>
</svg>
